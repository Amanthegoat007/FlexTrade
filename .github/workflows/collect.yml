name: collect

# WHY THIS EXISTS
#
# Every upstream source in this project is snapshot-only — MERIT, the state
# SLDCs and the Vidyut PRAVAH area price all publish "now" and no history. So
# depth exists only if we collect it, and a missed block is gone permanently.
#
# The laptop collector has a structural hole. Measured over 14 days: hours
# 05:00, 06:00 and 07:00 have NEVER been collected, and 67% of all snapshots
# land in the 10:00-16:00 window. Enabling WakeToRun on the scheduled tasks did
# not fix it, because the machine is shut down rather than asleep and nothing
# in software wakes a powered-off laptop.
#
# That hole is exactly the morning ramp, so an intraday multi-state model
# trained on the laptop's sample would never once have seen it. This runs the
# same collector on infrastructure that does not sleep, and commits the result,
# so coverage stops depending on whether anyone was at their desk.
#
# MEASURED CADENCE, 6 Aug 2026: the schedule below asks for every 15 minutes.
# GitHub delivered runs at 07:50, 10:23, 12:23, 14:42 and 16:25 UTC — roughly
# every two hours, about 12 a day against the 96 requested. The scheduler is
# best-effort and throttles hard, and this is what it actually gives.
#
# Two consequences worth stating rather than discovering later:
#   - this cannot provide 15-minute resolution. It fixes the laptop's blind
#     hours (05:00-07:00 were NEVER collected) by covering all 24 hours
#     sparsely; it does not give dense coverage.
#   - asking for */15 while receiving 1/120 means runs queue behind each other,
#     and a queued run in a concurrency group gets cancelled when a newer one
#     arrives. The "failure" at 16:25 was exactly that: cancelled before any
#     step ran, no code involved. Harmless, but it will recur.
# The cron is left at */15 deliberately: it costs nothing, and on a quiet
# scheduler we occasionally get a denser burst.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:        # so it can be triggered by hand to test

concurrency:
  # never let a slow run overlap the next tick and double-write
  group: collect
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    # Must exceed LOOP_MINUTES below, or the job is killed mid-loop.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: install
        run: pip install --quiet requests pandas

      - name: collect on a 15-minute loop
        # THE CADENCE FIX.
        #
        # cron cannot deliver every 15 minutes. GitHub's scheduler is
        # best-effort and throttles: asking for */15 produced runs ~2 hours
        # apart, about 12 a day against the 96 requested. No cron expression
        # fixes that, because the limit is on the scheduler and not the syntax.
        #
        # So stop relying on the scheduler for frequency and get it INSIDE one
        # job instead. A job may run up to 6 hours and this repository is
        # public, so Actions minutes are unlimited — one run can therefore
        # collect every 15 minutes for hours and cost nothing. The cron then
        # only has to fire often enough to keep a loop alive, which even a
        # throttled scheduler manages.
        #
        # Committing every tick would put ~96 commits a day on the branch and
        # make the history unreadable for humans, so ticks are collected and
        # pushed hourly. The most a cancelled run can lose is the current hour.
        env:
          # A SHORT burst per cron fire, not an all-day loop.
          #
          # The first version of this ran 5-hour loops to chase 15-minute
          # coverage. That is over the line: GitHub's Acceptable Use Policy
          # forbids using Actions for "serverless computing ... or any other
          # activity unrelated to the production, testing, deployment, or
          # publication of the software project", and a 24/7 collector is
          # exactly that. Scraping itself is fine and commonplace; sitting on a
          # runner all day is what gets read as resource abuse, and the stated
          # remedy is losing Actions access — which for us would take the repo
          # and the collector in one go.
          #
          # Three ticks per fire keeps each run to ~45 minutes, which is
          # ordinary git-scraping usage, and still triples what a single-shot
          # run collected.
          LOOP_MINUTES: "45"
          EVERY_SECONDS: "900"       # 15 min
          PUSH_EVERY_TICKS: "3"      # once per run, at the end
        run: |
          git config user.name  "flextrade-collector"
          git config user.email "collector@flextrade.local"
          END=$(( $(date +%s) + 60 * LOOP_MINUTES ))
          tick=0; captured=0; failed=0

          BR="${GITHUB_REF_NAME}"
          push_failed=0

          # Commit and push, LOUDLY.
          #
          # The previous version asked "is anything staged?" and returned 0 when
          # the answer was no. That is the wrong question and it hid a total
          # failure for a full day: the first push failed silently (a bare
          # `git push ... && echo` reports nothing and does not exit non-zero),
          # the commit stayed local, and every later call then found nothing
          # staged — because the rows were already committed — and reported that
          # as normal. Run #7 collected for 287 minutes across ~20 ticks, went
          # green, and delivered nothing to the branch.
          #
          # So: ask whether anything is UNPUSHED, capture push output instead of
          # discarding it, and verify the remote actually moved afterwards.
          push_now () {
            git add -A data/collected
            git diff --cached --quiet || \
              git commit -q -m "collect $(date -u '+%Y-%m-%d %H:%M UTC') (${tick} ticks)"

            git fetch -q --depth=1 origin "$BR" 2>/dev/null || true
            ahead=$(git rev-list --count "origin/${BR}..HEAD" 2>/dev/null || echo 0)
            if [ "$ahead" -eq 0 ]; then
              echo "nothing to push (no unpushed commits)"
              return 0
            fi
            echo "pushing ${ahead} commit(s) to ${BR}"

            for i in 1 2 3; do
              if out=$(git push origin "HEAD:${BR}" 2>&1); then
                echo "pushed at tick ${tick}"
                push_failed=0
                return 0
              fi
              echo "push attempt ${i} FAILED:"
              echo "${out}" | sed 's/^/    /'
              # remote moved under us: rebase our data commits on top and retry
              git fetch -q --depth=50 origin "$BR" || true
              git rebase -q "origin/${BR}" || { git rebase --abort || true; }
              sleep 5
            done
            push_failed=1
            return 1
          }

          while [ "$(date +%s)" -lt "$END" ]; do
            tick=$((tick + 1))
            echo "--- tick ${tick} $(date -u '+%H:%M:%S UTC') ---"
            if python flextrade/collect_ci.py; then
              captured=$((captured + 1))
            else
              failed=$((failed + 1))
              echo "::warning::tick ${tick} captured nothing"
            fi
            if [ $((tick % PUSH_EVERY_TICKS)) -eq 0 ]; then push_now || true; fi
            # do not sleep past the deadline
            now=$(date +%s)
            if [ $((now + EVERY_SECONDS)) -lt "$END" ]; then
              sleep "$EVERY_SECONDS"
            else
              break
            fi
          done

          push_now || true
          echo "loop done: ${tick} ticks, ${captured} captured, ${failed} empty"

          # A summary survives without admin rights on the logs, which is how
          # this failure stayed invisible for a day.
          {
            echo "### collect"
            echo "- ticks: ${tick}, captured: ${captured}, empty: ${failed}"
            echo "- unpushed commits at exit: $(git rev-list --count origin/${BR}..HEAD 2>/dev/null || echo '?')"
            echo "- remote ${BR}: $(git rev-parse --short origin/${BR} 2>/dev/null || echo '?')"
          } >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

          # A push that never landed is a FAILURE, however green the collection
          # looked. This is the check whose absence hid everything.
          left=$(git rev-list --count "origin/${BR}..HEAD" 2>/dev/null || echo 0)
          if [ "$push_failed" -eq 1 ] || [ "$left" -gt 0 ]; then
            echo "::error::collected ${captured} ticks but ${left} commit(s) never reached ${BR}. If the push output above shows 403, set Settings -> Actions -> General -> Workflow permissions to 'Read and write permissions'."
            exit 1
          fi
          # Every single tick failing is not a quiet upstream — it is a broken
          # collector or a runner that cannot reach these hosts.
          if [ "$captured" -eq 0 ]; then
            echo "::error::all ${tick} ticks captured nothing — see the probe output above"
            exit 1
          fi
